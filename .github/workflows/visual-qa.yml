name: Visual QA

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - ".github/workflows/visual-qa.yml"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Build app
        run: npm run build
      - name: Start app
        run: |
          npm start > /tmp/freshko-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/freshko-next.log
          exit 1
      - name: Capture all pages
        run: |
          mkdir -p qa-screenshots
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch();
            const routes = [
              ["home", "/"],
              ["privacy", "/privatnost"],
              ["cookies", "/kolacici"],
            ];
            const sizes = [
              ["desktop", { width: 1440, height: 1000 }],
              ["phone-375", { width: 375, height: 812 }],
              ["phone-393", { width: 393, height: 852 }],
              ["phone-430", { width: 430, height: 932 }],
            ];

            for (const [sizeName, viewport] of sizes) {
              const context = await browser.newContext({
                viewport,
                deviceScaleFactor: 1,
                reducedMotion: "reduce",
              });
              const page = await context.newPage();

              for (const [routeName, route] of routes) {
                await page.goto("http://127.0.0.1:3000" + route, { waitUntil: "networkidle" });
                await page.waitForTimeout(300);

                const dimensions = await page.evaluate(() => ({
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                }));
                if (dimensions.scrollWidth > dimensions.clientWidth + 1) {
                  throw new Error(`Horizontal overflow on ${routeName}-${sizeName}: ${dimensions.scrollWidth}px > ${dimensions.clientWidth}px`);
                }

                if (sizeName.startsWith("phone")) {
                  const mobileChecks = await page.evaluate(() => {
                    const targetSelectors = [
                      ".menu-button",
                      ".primary-action",
                      ".secondary-action",
                      ".mobile-floating-book",
                    ];
                    const undersized = [];
                    for (const selector of targetSelectors) {
                      const el = document.querySelector(selector);
                      if (!el) continue;
                      const r = el.getBoundingClientRect();
                      if (r.width < 44 || r.height < 44) undersized.push(`${selector}: ${Math.round(r.width)}x${Math.round(r.height)}`);
                    }
                    return { undersized };
                  });
                  if (mobileChecks.undersized.length) {
                    throw new Error(`Small touch targets on ${routeName}-${sizeName}: ${mobileChecks.undersized.join(", ")}`);
                  }
                }

                await page.screenshot({
                  path: `qa-screenshots/${routeName}-${sizeName}.png`,
                  fullPage: true,
                });

                if (routeName === "home" && sizeName === "phone-393") {
                  await page.locator("#zakazi").scrollIntoViewIfNeeded();
                  await page.waitForTimeout(150);
                  const inputFontSizes = await page.evaluate(() =>
                    Array.from(document.querySelectorAll("#zakazi input, #zakazi textarea, #zakazi select"))
                      .map((el) => parseFloat(getComputedStyle(el).fontSize))
                  );
                  if (inputFontSizes.some((size) => size < 16)) {
                    throw new Error(`Booking input below 16px on phone: ${inputFontSizes.join(",")}`);
                  }
                  const firstChoice = page.locator(".booking-choice").first();
                  if (await firstChoice.isVisible()) {
                    await firstChoice.click();
                    await page.getByRole("button", { name: /Nastavi/i }).click();
                    await page.waitForTimeout(250);
                    await page.screenshot({
                      path: "qa-screenshots/booking-phone-393.png",
                      fullPage: false,
                    });
                  }
                }
              }
              await context.close();
            }
            await browser.close();
          })();
          NODE
      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshko-visual-qa
          path: qa-screenshots
          if-no-files-found: error
