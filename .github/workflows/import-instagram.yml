name: Import Freshko Instagram Media

on:
  push:
    paths:
      - ".github/workflows/import-instagram.yml"

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: pip install --disable-pip-version-check requests
      - name: Download public Freshko images through reader fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import requests

          output = Path("public/media/freshko")
          output.mkdir(parents=True, exist_ok=True)
          headers = {"User-Agent": "Mozilla/5.0"}

          reader_urls = [
              "https://r.jina.ai/http://www.instagram.com/freshko.pg/",
              "https://r.jina.ai/https://www.instagram.com/freshko.pg/",
          ]

          markdown = ""
          for reader_url in reader_urls:
              try:
                  response = requests.get(reader_url, headers=headers, timeout=30)
                  print("Reader status:", response.status_code, reader_url)
                  if response.ok and len(response.text) > len(markdown):
                      markdown = response.text
              except Exception as exc:
                  print("Reader error:", repr(exc))

          print(markdown[:5000])

          candidates = []
          patterns = [
              r'https://[^\s\)\]"\']+\.cdninstagram\.com/[^\s\)\]"\']+',
              r'https://[^\s\)\]"\']+fbcdn\.net/[^\s\)\]"\']+',
              r'!\[[^\]]*\]\((https?://[^\)]+)\)',
          ]
          for pattern in patterns:
              for match in re.findall(pattern, markdown):
                  url = match if isinstance(match, str) else match[0]
                  if url not in candidates:
                      candidates.append(url)

          manifest = []
          for url in candidates:
              if len(manifest) >= 12:
                  break
              try:
                  image_response = requests.get(url, headers=headers, timeout=25)
                  content_type = image_response.headers.get("content-type", "")
                  if not image_response.ok or not content_type.startswith("image/"):
                      continue
                  filename = f"ig-{len(manifest) + 1:02d}.jpg"
                  (output / filename).write_bytes(image_response.content)
                  manifest.append({"file": f"/media/freshko/{filename}", "source": url})
              except Exception as exc:
                  print("Image error:", repr(exc))

          if not manifest:
              raise RuntimeError("Public reader returned no downloadable Freshko images")

          (output / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Downloaded {len(manifest)} Freshko images")
          PY
      - name: Commit imported media
        run: |
          git config user.name "Freshko media bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/media/freshko
          if git diff --cached --quiet; then
            echo "No media changes"
          else
            git commit -m "Import Freshko Instagram media"
            git push
          fi
