name: Import Freshko Instagram Media

on:
  push:
    paths:
      - ".github/workflows/import-instagram.yml"

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: pip install --disable-pip-version-check requests
      - name: Download public Freshko images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import requests

          username = "freshko.pg"
          output = Path("public/media/freshko")
          output.mkdir(parents=True, exist_ok=True)

          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36",
              "X-IG-App-ID": "936619743392459",
              "Accept": "*/*",
              "Referer": f"https://www.instagram.com/{username}/",
          }

          profile_url = f"https://www.instagram.com/api/v1/users/web_profile_info/?username={username}"
          response = requests.get(profile_url, headers=headers, timeout=20)
          response.raise_for_status()
          payload = response.json()
          user = payload.get("data", {}).get("user") or {}
          edges = (user.get("edge_owner_to_timeline_media") or {}).get("edges") or []

          manifest = []
          image_urls = []
          for edge in edges:
              node = edge.get("node") or {}
              shortcode = node.get("shortcode", "")
              caption_edges = (node.get("edge_media_to_caption") or {}).get("edges") or []
              caption = caption_edges[0].get("node", {}).get("text", "") if caption_edges else ""
              taken = node.get("taken_at_timestamp")
              sidecar = (node.get("edge_sidecar_to_children") or {}).get("edges") or []

              if sidecar:
                  for child in sidecar:
                      child_node = child.get("node") or {}
                      if not child_node.get("is_video") and child_node.get("display_url"):
                          image_urls.append((child_node["display_url"], shortcode, taken, caption))
              elif not node.get("is_video") and node.get("display_url"):
                  image_urls.append((node["display_url"], shortcode, taken, caption))

          for index, (url, shortcode, taken, caption) in enumerate(image_urls[:12], start=1):
              image_response = requests.get(url, headers=headers, timeout=25)
              image_response.raise_for_status()
              filename = f"ig-{index:02d}.jpg"
              (output / filename).write_bytes(image_response.content)
              manifest.append({
                  "file": f"/media/freshko/{filename}",
                  "shortcode": shortcode,
                  "taken_at": taken,
                  "caption": caption[:500],
              })

          if not manifest:
              raise RuntimeError("Instagram returned no public Freshko image media")

          (output / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Downloaded {len(manifest)} Freshko images")
          PY
      - name: Commit imported media
        run: |
          git config user.name "Freshko media bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/media/freshko
          if git diff --cached --quiet; then
            echo "No media changes"
          else
            git commit -m "Import Freshko Instagram media"
            git push
          fi
