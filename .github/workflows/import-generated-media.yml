name: Import Generated Freshko Media

on:
  push:
    paths:
      - ".github/workflows/import-generated-media.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download premium generated photography
        run: |
          mkdir -p public/media/freshko/generated
          curl -fL --retry 3 "https://at.adobe.com/77mFPVOpQrzTK5K1" -o public/media/freshko/generated/upholstery.png
          curl -fL --retry 3 "https://at.adobe.com/InZvchavr6Jpq94v" -o public/media/freshko/generated/armchair.png
          curl -fL --retry 3 "https://at.adobe.com/njgNNEpqpvUBirvX" -o public/media/freshko/generated/mattress.png
          curl -fL --retry 3 "https://at.adobe.com/5A576qEBlSmQrvkx" -o public/media/freshko/generated/carpet.png
          file public/media/freshko/generated/*
          ls -lh public/media/freshko/generated
      - name: Commit generated media
        run: |
          git config user.name "Freshko media bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/media/freshko/generated
          git commit -m "Import premium generated Freshko photography"
          git push
