name: Import HQ Freshko Media

on:
  push:
    paths:
      - ".github/workflows/import-hq-media.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full-resolution Freshko crops
        run: |
          mkdir -p public/media/freshko/hq
          curl -fL --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:c5886905-109a-46a8-80b7-2c1ba2f071d9" -o public/media/freshko/hq/hero-brand.png
          curl -fL --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:83cf3632-6d15-491a-8509-6706d29e35eb" -o public/media/freshko/hq/pricing.png
          curl -fL --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:87c35f01-d86b-48ec-9459-f640bfa8ec24" -o public/media/freshko/hq/carpet-before-after.png
          curl -fL --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:6564833f-4a45-4a18-ae59-4a44790e8272" -o public/media/freshko/hq/sofa-before-after.png
          curl -fL --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:06c18149-146f-45ed-9cf2-e4c4af98b9a2" -o public/media/freshko/hq/blue-carpet-before-after.png
          file public/media/freshko/hq/*
          ls -lh public/media/freshko/hq
      - name: Commit HQ media
        run: |
          git config user.name "Freshko media bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/media/freshko/hq
          git commit -m "Import high-quality Freshko media"
          git push
